[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vghks-sheet2cal"
version = "1.2.1"
description = "Independent persistent VGHKS surgery and FU calendar monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["google-auth[requests]==2.58.0", "cryptography==50.0.1", "requests==2.34.2", "vghks-sheet-core @ git+https://github.com/eyeduck-ai/op_spreadsheet.git@8eeecef64ef3d48ad72d3207afcf35ee849ef6f7#subdirectory=packages/python"]

[project.optional-dependencies]
dev = ["ruff==0.14.14"]

[project.scripts]
vghks-sheet2cal = "vghks_sheet2cal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vghks_sheet2cal = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".upstream", ".runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
